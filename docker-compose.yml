services:
  api:
    container_name: blue-carbon-cost-api
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_SYNCHRONIZE: "false"
      DB_SSL: "false"
      S3_ENDPOINT: http://host.docker.internal:9000
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./shared/config/.env
    command: ["pnpm", "api:dev"]
    networks:
      - 4-growth-docker-network
    depends_on:
      - database

  backoffice:
    container_name: blue-carbon-cost-admin
    environment:
      DB_HOST: database
      NODE_ENV: development
    env_file:
      - ./shared/config/.env
    volumes:
      - ./backoffice:/app/backoffice
      - ./api:/app/api
      - ./shared:/app/shared
      - /app/backoffice/node_modules
      - /app/api/node_modules
      - /app/shared/node_modules
    command: ["pnpm", "--filter", "backoffice", "run", "start:dev"]
    build:
      context: .
      dockerfile: backoffice/Dockerfile
    ports:
      - "1000:1000"
    networks:
      - 4-growth-docker-network
    depends_on:
      - database

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://api:4000"
        NEXTAUTH_SECRET: "mysupersecret"
        NEXTAUTH_URL: "http://client:3000/auth/api"
        NEXT_PUBLIC_MAPBOX_API_TOKEN: "${NEXT_PUBLIC_MAPBOX_API_TOKEN:-}"
    ports:
      - "3000:3000"
    networks:
      - 4-growth-docker-network

  # Used to test the integration between the client, api and backoffice.
  # Some dependencies are disabled as we typically use nginx and database containers only.
  nginx:
    image: nginx
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    ports:
      - 80:80
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - database
      # - client 
      # - api
      # - admin

  database:
    image: postgis/postgis:16-3.4
    container_name: blue-carbon-cost-db
    environment:
      POSTGRES_USER: blue-carbon-cost
      POSTGRES_PASSWORD: blue-carbon-cost
      POSTGRES_DB: blc
    ports:
      - "5434:5432"
    networks:
      - 4-growth-docker-network

  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    container_name: minio-dev
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web UI
    volumes:
      - .tmp/minio-dev:/data
    environment:
      - MINIO_ROOT_USER=testtest
      - MINIO_ROOT_PASSWORD=testtest
    command: server /data --console-address ":9001"

networks:
  4-growth-docker-network:
    driver: bridge